<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyNotes</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%237c5cff'/><path fill='%23fff' d='M20 16h26v8H28v4h12v8H28v4h18v8H20z'/></svg>">
<style>
:root{
  --bg:#fff;--bg2:#f5f6f8;--bg3:#e9ebef;--fg:#1f2328;--fg2:#5b6370;--bd:#d8dce2;
  --ac:#7c5cff;--ac2:#6a49f0;--acbg:rgba(124,92,255,.12);--code:#f0f1f4;--warn:#d9822b;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme=dark]{
  --bg:#1e1e22;--bg2:#252529;--bg3:#2e2e34;--fg:#dcddde;--fg2:#9a9ca3;--bd:#38383f;
  --ac:#a38bff;--ac2:#b8a5ff;--acbg:rgba(163,139,255,.16);--code:#2a2a30;--warn:#e8a05a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.5 var(--font);background:var(--bg);color:var(--fg);overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
#app{display:grid;grid-template-columns:44px auto 1fr auto;grid-template-rows:1fr 24px;height:100%}
#ribbon{grid-column:1;grid-row:1/3;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px}
#ribbon button{width:34px;height:34px;border-radius:6px;font-size:17px;color:var(--fg2)}
#ribbon button:hover{background:var(--bg3);color:var(--fg)}
#ribbon button.on{background:var(--acbg);color:var(--ac)}
#ribbon .sp{flex:1}
#left,#right{background:var(--bg2);overflow:hidden;display:flex;flex-direction:column;min-width:0}
#left{grid-column:2;grid-row:1;width:280px;border-right:1px solid var(--bd)}
#right{grid-column:4;grid-row:1;width:270px;border-left:1px solid var(--bd)}
.hidden{display:none!important}
.phead{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--bd);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg2)}
.phead .sp{flex:1}
.phead button{font-size:15px;color:var(--fg2);padding:2px 6px;border-radius:4px}
.phead button:hover{background:var(--bg3);color:var(--fg)}
.pbody{flex:1;overflow:auto;padding:6px 0}
.tree .row{display:flex;align-items:center;gap:6px;padding:3px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;margin:0 4px;color:var(--fg)}
.tree .row:hover{background:var(--bg3)}
.tree .row.active{background:var(--acbg);color:var(--ac)}
.tree .row .ic{width:14px;text-align:center;color:var(--fg2);font-size:11px;flex:none}
.tree .row .nm{overflow:hidden;text-overflow:ellipsis}
.tree .row .dot{color:var(--warn);margin-left:auto}
.tree .row.dir{font-weight:500}
.tree .kids{margin-left:12px;border-left:1px solid var(--bd)}
.sbox{padding:8px 10px}
.sbox input{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);outline:none}
.sbox input:focus{border-color:var(--ac)}
.res{padding:6px 12px;cursor:pointer;border-radius:4px;margin:0 4px}
.res:hover{background:var(--bg3)}
.res .rt{font-weight:600}
.res .rp{color:var(--fg2);font-size:11px}
.res .sn{color:var(--fg2);font-size:12px;margin-top:2px;overflow-wrap:anywhere}
mark{background:rgba(255,200,0,.35);color:inherit;border-radius:2px}
.tagitem{display:flex;justify-content:space-between;padding:4px 12px;cursor:pointer;border-radius:4px;margin:0 4px}
.tagitem:hover{background:var(--bg3)}
.tagitem .c{color:var(--fg2);font-size:12px}
.sec{padding:6px 12px 2px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--fg2);margin-top:6px}
.link{padding:3px 12px;cursor:pointer;border-radius:4px;margin:0 4px;overflow-wrap:anywhere}
.link:hover{background:var(--bg3)}
.link small{display:block;color:var(--fg2);font-size:11.5px}
.link.un{color:var(--warn)}
.muted{color:var(--fg2);padding:6px 12px;font-size:12.5px}
#main{grid-column:3;grid-row:1;display:flex;min-width:0;min-height:0;background:var(--bg);position:relative}
#main.dir-col{flex-direction:column}
.pane{flex:1 1 0;display:flex;flex-direction:column;min-width:0;min-height:0}
.divider{flex:none;background:var(--bd);position:relative;z-index:3}
.dir-row>.divider{width:2px}.dir-col>.divider{height:2px}
.divider::after{content:"";position:absolute}
.dir-row>.divider::after{inset:0 -4px;cursor:col-resize}.dir-col>.divider::after{inset:-4px 0;cursor:row-resize}
.divider:hover,.divider.drag{background:var(--ac)}
.splitzone{display:none;position:absolute;z-index:6;align-items:center;justify-content:center;border:2px dashed var(--ac);background:var(--acbg);color:var(--ac);font-weight:600;border-radius:8px;margin:6px}
#main.dragtab .splitzone{display:flex}
.dir-row>.splitzone{top:34px;bottom:0;right:0;width:40%}.dir-col>.splitzone{left:0;right:0;bottom:0;height:40%}
.tab.dropt{box-shadow:inset 2px 0 0 var(--ac)}
.tabbar{display:flex;align-items:flex-end;background:var(--bg2);border-bottom:1px solid var(--bd);min-height:36px}
.tabs{display:flex;align-items:flex-end;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:4px 4px 0;gap:2px}
.tbtns{display:flex;flex:none;align-self:stretch;align-items:center}
.tab{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-radius:7px 7px 0 0;cursor:pointer;color:var(--fg2);white-space:nowrap;flex:0 1 200px;min-width:76px;container-type:inline-size;overflow:hidden;position:relative}
.tab:not(.on):hover{background:var(--bg3);color:var(--fg)}
.tab.on{background:var(--bg);color:var(--fg);box-shadow:inset 0 2px 0 var(--ac)}
.pane:not(.act) .tab.on{box-shadow:inset 0 2px 0 var(--bd)}
.tab .tt{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tab .x{border-radius:4px;padding:0 5px;color:var(--fg2);flex:none}
@container (max-width:100px){.tab:not(.on) .x{display:none}.tab:not(.on):hover .x{display:inline}}
.tab .x:hover{background:var(--bg3);color:var(--fg)}
.tabbar button{padding:6px 9px;color:var(--fg2);border-radius:5px;align-self:center}
.tabbar button:hover:not(:disabled){color:var(--fg);background:var(--bg3)}
.tabbar button:disabled{opacity:.35;cursor:default}
.tabbar [hidden]{display:none}
.toolbar{display:flex;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid var(--bd)}
.toolbar input.title{flex:1;border:0;background:none;outline:none;font-size:15px;font-weight:600;min-width:0;padding:2px 0}
.toolbar .path{color:var(--fg2);font-size:12px;white-space:nowrap}
.seg{display:flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.seg button{padding:2px 9px;font-size:12px;color:var(--fg2)}
.seg button.on{background:var(--acbg);color:var(--ac)}
.body{flex:1;display:flex;min-height:0;position:relative}
.body textarea.ed{flex:1;border:0;outline:none;resize:none;padding:18px 28px;background:var(--bg);font:14px/1.65 var(--mono);tab-size:2;min-width:0;color:var(--fg)}
.body .pv{flex:1;overflow:auto;padding:18px 32px 60px;min-width:0}
.body.m-source .pv,.body.m-preview textarea.ed{display:none}
.body.m-rich textarea.ed,.body.m-rich .pv{display:none}
.richwrap{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.rtb{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:4px 12px;border-bottom:1px solid var(--bd);background:var(--bg)}
.rtb button{min-width:28px;height:28px;padding:0 6px;border-radius:5px;color:var(--fg2);font-size:13px}
.rtb button:hover{background:var(--bg3);color:var(--fg)}
.rtb .sep{width:1px;height:18px;background:var(--bd);margin:0 4px}
.rscroll{flex:1;overflow:auto;padding:18px 32px 80px;cursor:text}
.rich{outline:none;min-height:60vh}
.rich .wikilink{user-select:all}
.rich td,.rich th{min-width:60px}
.rich li.task input{cursor:pointer}
.body.m-split textarea.ed{border-right:1px solid var(--bd)}
.empty{margin:auto;color:var(--fg2);text-align:center;line-height:2}
.empty kbd,.help kbd{background:var(--bg3);border:1px solid var(--bd);border-radius:4px;padding:0 6px;font:12px var(--mono)}
.md{max-width:820px;margin:0 auto;line-height:1.7}
.md h1,.md h2,.md h3,.md h4{line-height:1.3;margin:1.3em 0 .5em}
.md h1{font-size:1.9em;border-bottom:1px solid var(--bd);padding-bottom:.2em}
.md h2{font-size:1.5em}.md h3{font-size:1.25em}.md h4,.md h5,.md h6{font-size:1.05em}
.md>*:first-child{margin-top:0}
.md p{margin:.6em 0}
.md a{color:var(--ac)}
.md code{background:var(--code);padding:1px 5px;border-radius:4px;font:.9em var(--mono)}
.md pre{background:var(--code);padding:12px 14px;border-radius:8px;overflow:auto}
.md pre code{background:none;padding:0}
.md blockquote{margin:.8em 0;padding:.1em 1em;border-left:3px solid var(--ac);color:var(--fg2)}
.md table{border-collapse:collapse;margin:.8em 0}
.md th,.md td{border:1px solid var(--bd);padding:5px 12px}
.md th{background:var(--bg2)}
.md img{max-width:100%}
.md hr{border:0;border-top:1px solid var(--bd);margin:1.5em 0}
.md ul,.md ol{padding-left:1.6em;margin:.4em 0}
.md li.task{list-style:none;margin-left:-1.3em}
.md li.task input{margin-right:6px;cursor:pointer}
.md li.done>span.t{text-decoration:line-through;color:var(--fg2)}
.md .wikilink{color:var(--ac);cursor:pointer;text-decoration:none;border-bottom:1px dashed transparent}
.md .wikilink:hover{border-bottom-color:var(--ac)}
.md .wikilink.un{color:var(--warn)}
.md .tag{background:var(--acbg);color:var(--ac);border-radius:10px;padding:0 7px;cursor:pointer;font-size:.9em}
.md .props{background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;margin-bottom:1em;font-size:13px}
.md .props b{color:var(--fg2);font-weight:500;margin-right:6px}
.md .callout{border-left:4px solid var(--ac);background:var(--acbg);border-radius:6px;padding:8px 14px;margin:.8em 0}
.md .callout .ct{font-weight:600;text-transform:capitalize}
.md .callout.warning,.md .callout.caution{border-color:var(--warn);background:rgba(232,160,90,.14)}
.md .callout.tip,.md .callout.success{border-color:#3fb27f;background:rgba(63,178,127,.13)}
.md .callout.danger,.md .callout.bug,.md .callout.failure{border-color:#e25555;background:rgba(226,85,85,.13)}
.md mark{background:rgba(255,200,0,.35)}
.md .embed{border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:6px;padding:2px 16px 8px;margin:.9em 0;background:var(--bg2);user-select:text}
.md .embed .et{font-size:12px;color:var(--fg2);margin:6px 0 0}
.md .embed .eb>*:first-child{margin-top:.4em}
.md .embed.un{border-left-color:var(--warn)}
.tree .row.dropt{background:var(--acbg);outline:1px dashed var(--ac)}
.tree.dropt{outline:1px dashed var(--ac);outline-offset:-3px}
.tree .row[draggable=true]{cursor:grab}
#status{grid-column:2/5;grid-row:2;background:var(--bg2);border-top:1px solid var(--bd);display:flex;gap:16px;align-items:center;padding:0 12px;font-size:12px;color:var(--fg2)}
#status .sp{flex:1}
.gwrap{flex:1;position:relative;min-width:0}
.gwrap canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;background:var(--bg)}
.gctl{position:absolute;top:10px;left:10px;display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;z-index:2;font-size:12.5px}
.gctl input[type=text]{border:1px solid var(--bd);border-radius:5px;background:var(--bg);padding:2px 6px;outline:none;width:140px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh;z-index:50}
.modal{background:var(--bg);border:1px solid var(--bd);border-radius:10px;width:min(560px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.4);overflow:hidden}
.modal>input{width:100%;border:0;border-bottom:1px solid var(--bd);padding:12px 16px;font-size:15px;outline:none;background:none}
.modal .list{max-height:50vh;overflow:auto;padding:4px}
.modal .it{padding:7px 12px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.modal .it.sel{background:var(--acbg)}
.modal .it small{color:var(--fg2)}
.modal h3{margin:0;padding:14px 16px 0}
.modal .pad{padding:14px 18px}
.btn{background:var(--ac);color:#fff;padding:7px 14px;border-radius:6px;margin:4px 6px 4px 0}
.btn.alt{background:var(--bg3);color:var(--fg)}
.help table{border-collapse:collapse;width:100%}
.help td{padding:3px 6px;border-bottom:1px solid var(--bd)}
#ctx{max-height:70vh;overflow:auto;position:fixed;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:4px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.35);min-width:150px}
#ctx div{padding:6px 12px;border-radius:5px;cursor:pointer}
#ctx div:hover{background:var(--acbg)}
#ac{position:fixed;background:var(--bg);border:1px solid var(--bd);border-radius:8px;z-index:70;box-shadow:0 8px 30px rgba(0,0,0,.35);max-width:320px;overflow:hidden}
#ac div{padding:4px 12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ac div.sel{background:var(--acbg)}
#toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:.95}
@media(max-width:800px){#right{display:none}#left{width:220px}}
#fatal{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--fg);padding:12vh 8vw;overflow:auto}
#fatal h3{font-size:20px;margin:0 0 12px}#fatal p{max-width:560px;line-height:1.6;color:var(--fg2)}
</style>
</head>

<noscript><div style="position:fixed;inset:0;z-index:100;background:#1e1e22;color:#dcddde;padding:12vh 8vw;font:15px/1.6 sans-serif"><h3>EasyNotes needs JavaScript</h3><p>JavaScript is turned off or blocked for this page. Enable it for local files in your browser settings, or ask your IT team if the browser is managed.</p></div></noscript>
<div id="app">
  <div id="ribbon"></div>
  <div id="left"></div>

</div>
<div id="toast"></div>
<input type="file" id="imgpicker" class="hidden" accept="image/*" multiple>
<input type="file" id="importer" class="hidden" multiple accept=".md,.json,text/markdown,application/json">
<script>
'use strict';
/* ============================ helpers ============================ */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);

  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));

}
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const base = p => p.replace(/^.*\//, '').replace(/\.md$/i, '');
const noext = p => p.replace(/\.md$/i, '');
const IMG_EXT = /\.(png|jpe?g|gif|svg|webp|bmp|avif)$/i;
const EMBED_LINE = /^\s*!\[\[([^\]|#\n]+)(#[^\]|\n]+)?(\|[^\]\n]+)?\]\]\s*$/;
const EMBED_STACK = [];
const isEmbedLine = l => { const m = l.match(EMBED_LINE); return !!m && !IMG_EXT.test(m[1].trim()); };
const pad2 = n => String(n).padStart(2, '0');
const dateStr = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const timeStr = (d = new Date()) => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const cleanPath = p => p.split('/').map(s => s.replace(/[\\:*?"<>|]/g, '').trim()).filter(Boolean).join('/');
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
function fuzzy(q, s) {
  q = q.toLowerCase(); const t = s.toLowerCase(); if (!q) return 0;
  let qi = 0, score = 0, last = -2;
  for (let i = 0; i < t.length && qi < q.length; i++) {
    if (t[i] === q[qi]) { score += last === i - 1 ? 5 : 1; if (i === 0 || /[\/\s\-_]/.test(t[i - 1])) score += 3; last = i; qi++; }
  }

  if (base(t).includes(q)) score += 10;
  return score - t.length * 0.01;

/* ============================ storage backends ============================ */
const LS = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } } };
const LS_KEY = 'easynotes:vault', ASSET_KEY = 'easynotes:assets';
class LocalBackend {
  constructor() { this.name = 'Browser storage'; this.kind = 'local'; this.mem = null; this.first = false; }

    if (!this.mem) { let d = null; try { d = JSON.parse(LS.get(LS_KEY) || 'null'); } catch {} this.first = d === null; this.mem = d || {}; }

  async load() { const d = this._data(); return this.first ? null : Object.entries(d).map(([path, content]) => ({ path, content, mtime: 0 })); }
  async write(path, content) { this._data()[path] = content; LS.set(LS_KEY, JSON.stringify(this.mem)); return 0; }
  async remove(path) { delete this._data()[path]; LS.set(LS_KEY, JSON.stringify(this.mem)); }
  _assets() { if (!this.am) { try { this.am = JSON.parse(LS.get(ASSET_KEY) || '{}') || {}; } catch { this.am = {}; } } return this.am; }

  async readAsset(path) { return this._assets()[path]; }
  async writeAsset(path, blob) {
    const url = await new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(blob); });

class FSBackend {
  constructor(root) { this.root = root; this.name = root.name; this.kind = 'fs'; }

  async _walk(dir, prefix, out) {
    for await (const [name, handle] of dir.entries()) {

    const parts = path.split('/'); const name = parts.pop();
    const d = await this._dir(parts, true); const fh = await d.getFileHandle(name, { create: true });

  }
  async readAsset(path) { const parts = path.split('/'); const name = parts.pop(); return (await (await this._dir(parts, false)).getFileHandle(name)).getFile(); }
  async writeAsset(path, blob) {
    const parts = path.split('/'); const name = parts.pop(); const d = await this._dir(parts, true);
    const w = await (await d.getFileHandle(name, { create: true })).createWritable(); await w.write(blob); await w.close();
  }
}

/* ============================ index ============================ */
const WIKI_RE = /\[\[([^\]|#\n]+)(#[^\]|\n]+)?(\|[^\]\n]+)?\]\]/g;

    const kv = line.match(/^([\w-]+):\s*(.*)$/); if (!kv) continue;
    props.push([kv[1], kv[2]]);

      kv[2].replace(/[\[\]]/g, '').split(/[,\s]+/).filter(Boolean).forEach(t => tags.push(t.replace(/^#/, '')));

}
function reindex() {
  const I = { links: new Map(), tags: new Map(), back: new Map(), byBase: new Map(), byFull: new Map() };
  for (const p of S.notes.keys()) {
    I.byFull.set(noext(p).toLowerCase(), p);
    const b = base(p).toLowerCase(); if (!I.byBase.has(b)) I.byBase.set(b, p);

    const text = stripCode(n.content);
    const links = [];
    for (const m of text.matchAll(WIKI_RE)) { if (IMG_EXT.test(m[1].trim())) continue; links.push({ name: m[1].trim(), target: resolve(m[1]) }); }
    I.links.set(p, links);
    for (const l of links) if (l.target && l.target !== p) { if (!I.back.has(l.target)) I.back.set(l.target, new Set()); I.back.get(l.target).add(p); }

    for (const t of tags) { if (!I.tags.has(t)) I.tags.set(t, new Set()); I.tags.get(t).add(p); }
  }
}

/* ============================ markdown ============================ */
function inline(s) {

  s = esc(s);

  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, a, u) => { if (/^\s*javascript:/i.test(u)) return m; if (/^(https?:|data:|blob:)/i.test(u)) return `<img alt="${a}" src="${u}">`; const ap = findAsset(decodeURI(u.replace(/&amp;/g, '&'))); return ap ? `<img alt="${a}" data-asset="${esc(ap)}" data-src="${u}">` : `<img alt="${a}" src="${u}">`; });
  s = s.replace(/\[\[([^\]|#\n]+)(#[^\]|\n]+)?(\|[^\]\n]+)?\]\]/g, (m, t, hd, al) => {
    const target = resolve(t.replace(/&amp;/g, '&'));
    const label = al ? al.slice(1) : (t + (hd || '').replace('#', ' > '));
    return `<a class="wikilink${target ? '' : ' un'}" data-target="${t}" data-raw="${m}" title="Ctrl+click to open">${label}</a>`;
  });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => /^\s*javascript:/i.test(u) ? m : `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`);

  s = s.replace(/(^|[^\w*])\*(?!\s)(.+?)(?<!\s)\*(?!\w)/g, '$1<em>$2</em>');
  s = s.replace(/(^|[^\w])_(?!\s)(.+?)(?<!\s)_(?!\w)/g, '$1<em>$2</em>');
  s = s.replace(/~~(.+?)~~/g, '<del>$1</del>');
  s = s.replace(/==(.+?)==/g, '<mark>$1</mark>');
  s = s.replace(/(^|[\s(>])#([A-Za-z_][\w\-\/]*)/g, '$1<span class="tag" data-tag="$2">#$2</span>');

}
function splitRow(l) {

}
function renderList(items) {
  let html = '', stack = [];
  for (const it of items) {
    const tag = it.ordered ? 'ol' : 'ul';
    const top = stack[stack.length - 1];
    if (!top || it.indent > top.indent) { html += `<${tag}>`; stack.push({ indent: it.indent, tag }); }
    else {
      while (stack.length > 1 && it.indent < stack[stack.length - 1].indent) { html += `</li></${stack.pop().tag}>`; }
      html += '</li>';
    }
    if (it.task) html += `<li class="task${it.task === 'x' ? ' done' : ''}"><input type="checkbox" contenteditable="false" data-line="${it.line}"${it.task === 'x' ? ' checked' : ''}><span class="t">${inline(it.text)}</span>`;
    else html += `<li>${inline(it.text)}`;

function sectionOf(src, heading) {

  while (j < L.length) { const m = L[j].match(/^(#{1,6})\s/); if (m && m[1].length <= lvl) break; j++; }

function embedHtml(name, heading, raw) {

  if (!target) return open + title(' (note not found)') + '</div>';

function md(src) {
  const L = src.replace(/\r\n?/g, '\n').split('\n'); let i = 0; const out = [];

/* ============================ note operations ============================ */
async function saveNote(n) {
  clearTimeout(n._t);
  if (!n.dirty) return;
  setStatus('Saving…');
  try { n.mtime = (await S.backend.write(n.path, n.content)) || 0; n.dirty = false; setStatus('Saved'); }
  catch (e) { setStatus('Save failed'); toast('Save failed: ' + e.message); }
  renderLeft();
}
const flushAll = () => Promise.all([...S.notes.values()].filter(n => n.dirty).map(saveNote));
function scheduleSave(n) { n.dirty = true; setStatus('Unsaved…'); clearTimeout(n._t); n._t = setTimeout(() => saveNote(n), 500); }
function uniquePath(p) {
  p = cleanPath(p).replace(/\.md$/i, ''); if (!p) p = 'Untitled';
  let c = p, k = 1; while (S.notes.has(c + '.md')) c = `${p} ${k++}`;
  return c + '.md';
}
async function createNote(path, content = '', openIt = true) {
  const p = uniquePath(path);
  const n = { path: p, content, mtime: 0, dirty: false };
  S.notes.set(p, n);
  try { n.mtime = (await S.backend.write(p, content)) || 0; } catch (e) { toast('Create failed: ' + e.message); }
  reindex(); renderLeft(); renderRight();
  if (openIt) openNote(p);
  return p;
}
async function newNote(folder = '') {
  const name = await askText('New note (use / for folders)', (folder ? folder + '/' : '') + 'Untitled');
  if (name) createNote(name);
}
async function deleteNote(path) {
  if (!confirm(`Delete "${noext(path)}"? This cannot be undone.`)) return;
  const n = S.notes.get(path); if (n) clearTimeout(n._t);
  try { await S.backend.remove(path); } catch (e) { toast('Delete failed: ' + e.message); return; }
  S.notes.delete(path);
  for (const p of S.panes) p.tabs = p.tabs.filter(t => t.path !== path);
  normalizePanes(); reindex(); renderAll();
}
async function renameNote(path, newName, exact, quiet) {
  newName = cleanPath(newName).replace(/\.md$/i, '');
  if (!newName) return;
  // keep folder if user typed only a name
  if (!exact && !newName.includes('/') && path.includes('/')) newName = path.replace(/[^\/]*$/, '') + newName;
  const np = newName + '.md';
  if (np === path) return;
  if (S.notes.has(np)) { toast('A note with that name exists'); return; }
  const n = S.notes.get(path); await saveNote(n);
  const oldResolve = nm => resolve(nm);
  const uniqueBase = ![...S.notes.keys()].some(k => k !== path && base(k).toLowerCase() === base(np).toLowerCase());
  const linkName = uniqueBase ? base(np) : newName;
  // rewrite links in other notes (using the OLD index)
  const edits = [];
  for (const [p, o] of S.notes) {
    const upd = o.content.replace(WIKI_RE, (m, t, hd, al) => oldResolve(t) === path ? `[[${linkName}${hd || ''}${al || ''}]]` : m);
    if (upd !== o.content) edits.push([o, upd]);
  }
  try {
    await S.backend.write(np, n.content); await S.backend.remove(path);
  } catch (e) { toast('Rename failed: ' + e.message); return; }
  S.notes.delete(path); n.path = np; S.notes.set(np, n);
  for (const pane of S.panes) for (const t of pane.tabs) if (t.path === path) t.path = np;
  for (const [o, upd] of edits) { o.content = upd; o.dirty = true; await saveNote(o); }
  reindex(); renderAll();
  if (edits.length && !quiet) toast(`Updated links in ${edits.length} note${edits.length > 1 ? 's' : ''}`);
}

  const np = (folder ? folder + '/' : '') + base(path);
  if (np + '.md' === path) return;
  await renameNote(path, np, true);
  if (folder) S.collapsed.delete(folder);
  renderLeft();
}
async function moveDir(dir, folder) {
  if (folder === dir || folder.startsWith(dir + '/')) return toast('A folder cannot be moved into itself');
  const target = (folder ? folder + '/' : '') + dir.split('/').pop(); if (target === dir) return;
  const paths = [...S.notes.keys()].filter(p => p.startsWith(dir + '/'));
  for (const p of paths) await renameNote(p, target + '/' + p.slice(dir.length + 1), true, true);
  if (folder) S.collapsed.delete(folder);

/* ============================ tabs & panes ============================ */

  'Ideas.md': `# Ideas\n\nBack to [[Welcome]].\n\n- Build a second brain #ideas\n- Write more [[Projects/Roadmap|roadmaps]]\n`,
  'Projects/Roadmap.md': `# Roadmap\n\n- [ ] Ship v1\n- [ ] Collect feedback\n\nRelated: [[Ideas]] #project\n`,
  'Templates/Daily Note.md': `# {{date}}\n\n## Tasks\n- [ ] \n\n## Notes\n\n`,
  'Templates/Meeting.md': `# {{title}}\n\n**Date:** {{date}} {{time}}\n**Attendees:** \n\n## Agenda\n\n## Notes\n\n## Action items\n- [ ] \n`,
};
async function loadVault(backend, seed) {
  await flushAll();
  S.backend = backend; S.notes = new Map();
  let files = await backend.load();
  if (files === null) { files = []; for (const [p, c] of Object.entries(SEED)) { files.push({ path: p, content: c, mtime: 0 }); } for (const f of files) await backend.write(f.path, f.content); }
  for (const f of files) S.notes.set(f.path, { ...f, dirty: false });
  S.assets = new Set(backend.assetList ? backend.assetList() : []); assetUrls.clear();
  reindex(); return true;
}
async function openLocal() {
  LS.set('easynotes:mode', 'local');
  S.panes = [{ tabs: [], active: 0 }]; S.activePane = 0;
  await loadVault(new LocalBackend());
  openNote('Welcome.md'); toast('Using browser storage');
}
async function pickFolder() {
  try {
    const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
    await withTimeout(kvSet('dir', dir), 2000); LS.set('easynotes:mode', 'fs');
    S.panes = [{ tabs: [], active: 0 }]; S.activePane = 0;
    await loadVault(new FSBackend(dir)); renderAll();
    const first = [...S.notes.keys()].sort()[0]; if (first) openNote(first);
    toast(`Opened ${dir.name} (${S.notes.size} notes)`);
  } catch (e) { if (e.name !== 'AbortError') toast('Could not open folder: ' + e.message); }
}
async function reloadVault(manual) {
  if (!S.backend || S.backend.kind !== 'fs') { if (manual) toast('Only folder vaults can be reloaded'); return; }
  try {
    const files = await S.backend.load(); const seen = new Set(); S.assets = new Set(S.backend.assetList());
    for (const f of files) {
      seen.add(f.path); const n = S.notes.get(f.path);
      if (!n) S.notes.set(f.path, { ...f, dirty: false });
      else if (!n.dirty && f.mtime !== n.mtime && f.content !== n.content) { n.content = f.content; n.mtime = f.mtime; }
    }
    for (const p of [...S.notes.keys()]) if (!seen.has(p) && !S.notes.get(p).dirty) S.notes.delete(p);
    for (const pane of S.panes) pane.tabs = pane.tabs.filter(t => t.type !== 'note' || S.notes.has(t.path));
    reindex(); renderAll(); if (manual) toast('Vault reloaded');
  } catch (e) { if (manual) toast('Reload failed: ' + e.message); }
}
function exportVault() {
  const o = {}; for (const [p, n] of S.notes) o[p] = n.content;
  const a = h('a', { href: URL.createObjectURL(new Blob([JSON.stringify(o, null, 2)], { type: 'application/json' })), download: `easynotes-${dateStr()}.json` });
  document.body.append(a); a.click(); a.remove();
}
async function importFiles(files, folder = '') {
  let c = 0;
  for (const f of files) {
    const text = await f.text();
    if (/\.json$/i.test(f.name)) { try { for (const [p, v] of Object.entries(JSON.parse(text))) if (typeof v === 'string') { await createNote(p.replace(/\.md$/i, ''), v, false); c++; } } catch { toast('Invalid JSON'); } }
    else { await createNote((folder ? folder + '/' : '') + f.name.replace(/\.md$/i, ''), text, false); c++; }
  }
  renderAll(); toast(`Imported ${c} note${c === 1 ? '' : 's'}`);
}
function startScreen(savedDir) {
  S.booted = true;
  return new Promise(res => {
    const { close, o } = overlay(h('div', { class: 'modal' }, h('h3', {}, 'Welcome to EasyNotes'), h('div', { class: 'pad' },
      h('p', {}, savedDir ? 'Pick up where you left off (press Enter):' : 'Choose where your notes live:'),
      savedDir ? h('button', { class: 'btn', onclick: async () => { try { if ((await savedDir.requestPermission({ mode: 'readwrite' })) !== 'granted') throw new Error('Permission denied'); close(); res(new FSBackend(savedDir)); } catch (e) { toast(e.message); } } }, `Reopen "${savedDir.name}"`) : null,
      FS_OK ? h('button', { class: savedDir ? 'btn alt' : 'btn', onclick: async () => { try { const d = await window.showDirectoryPicker({ mode: 'readwrite' }); await withTimeout(kvSet('dir', d), 2000); close(); res(new FSBackend(d)); } catch (e) { if (e.name !== 'AbortError') toast(e.message); } } }, 'Open a folder on disk (real .md files)') : null,
      h('button', { class: 'btn alt', onclick: () => { close(); res(new LocalBackend()); } }, 'Use browser storage'),
      !FS_OK ? h('p', { class: 'muted' }, 'Your browser has no folder-access API (use Chrome/Edge/Brave for real files).') : null,
      FS_OK ? h('p', { class: 'muted', style: 'padding:6px 0 0' }, 'Tip: in Chrome choose "Allow on every visit" when prompted and it will reopen with no clicks.') : null)));
    const b = o.querySelector('.btn'); if (b) b.focus();
  });
}

/* ============================ keyboard ============================ */
window.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (S.modalOpen) return;
  const go = fn => { e.preventDefault(); fn(); };
  if (mod && !e.shiftKey && k === 'o') go(quickSwitcher);
  else if (mod && !e.shiftKey && k === 'p') go(showCommands);
  else if (mod && e.shiftKey && k === 'p') go(showCommands);
  else if (mod && e.shiftKey && k === 'f') go(() => { S.leftPanel = 'search'; S.leftOpen = true; S.focusSearch = true; renderAll(); });
  else if (mod && k === 'd') go(openDaily);
  else if (mod && k === 'g') go(openGraph);
  else if (mod && k === 'e') go(cycleMode);
  else if (mod && k === 's') go(() => { const n = activeNote(); if (n) saveNote(n); });
  else if (mod && k === '\\') go(() => splitPane());
  else if ((e.altKey && k === 'n') || (mod && k === 'n')) go(() => newNote());
  else if (e.altKey && k === 'w') go(() => closeTab(S.activePane, S.panes[S.activePane].active));
  else if (k === 'f2') go(async () => { const n = activeNote(); if (n) { const nn = await askText('Rename note', noext(n.path)); if (nn) renameNote(n.path, nn); } });
});
document.addEventListener('visibilitychange', () => { if (document.hidden) flushAll(); else if (!S.modalOpen && ![...S.notes.values()].some(n => n.dirty)) reloadVault(false); });
window.addEventListener('beforeunload', e => { if ([...S.notes.values()].some(n => n.dirty)) { flushAll(); e.preventDefault(); e.returnValue = ''; } });
$('#importer').addEventListener('change', e => { importFiles([...e.target.files]); e.target.value = ''; });

/* ============================ boot ============================ */
function showFatal(detail) {
  if ($('#fatal')) return;
  document.body.append(h('div', { id: 'fatal' }, h('h3', {}, 'EasyNotes could not start'),
    h('p', {}, String(detail || 'Unknown error')),
    h('p', {}, 'Press F12 and open the Console tab to see details. This can happen when the browser, or your organisation, blocks JavaScript or storage for local files.'),
    h('button', { class: 'btn', onclick: () => location.reload() }, 'Reload')));
}
window.addEventListener('error', e => { if (!S.booted) showFatal(e.message); });
window.addEventListener('unhandledrejection', e => { if (!S.booted) showFatal(e.reason && e.reason.message || e.reason); });
(async function boot() {
  const watchdog = setTimeout(() => { if (!S.booted) showFatal('Startup is taking longer than expected.'); }, 6000);
  try { await bootMain(); } catch (e) { showFatal(e && e.message || e); } finally { clearTimeout(watchdog); }
})();
async function bootMain() {
  const ui = loadUI(); document.documentElement.dataset.theme = S.theme;
  let backend = null; const mode = LS.get('easynotes:mode');
  const saved = FS_OK ? await withTimeout(kvGet('dir'), 2000, null) : null;
  if (mode === 'fs' && saved) {
    try { if ((await saved.queryPermission({ mode: 'readwrite' })) === 'granted') backend = new FSBackend(saved); } catch {}
    if (!backend) backend = await startScreen(saved);
  } else if (mode === 'local') backend = new LocalBackend();
  else backend = await startScreen(saved);
  LS.set('easynotes:mode', backend.kind);
  try { await loadVault(backend); } catch (e) { toast('Failed to open vault: ' + e.message); await loadVault(new LocalBackend()); }
  // restore tabs
  if (ui.panes && ui.panes.length) {
    S.panes = ui.panes.map(p => ({ active: p.active || 0, tabs: p.tabs.filter(t => t.type === 'graph' || S.notes.has(t.path)).map(t => (t.mode === 'edit' ? { ...t, mode: 'source' } : t)) })).slice(0, 2);
    S.activePane = ui.activePane || 0;
  }
  if (!S.panes.some(p => p.tabs.length)) { const first = S.notes.has('Welcome.md') ? 'Welcome.md' : [...S.notes.keys()].sort()[0]; S.panes = [{ tabs: first ? [{ type: 'note', path: first, mode: 'rich' }] : [], active: 0 }]; S.activePane = 0; }
  renderAll(); S.booted = true;
}
</script>
